id: major-15-the-devil
name: The Devil
arcana: major
number: 15
image: major-15-the-devil.jpg

keywords:
  upright: [attachment, temptation, unhealthy patterns, materialism, feeling trapped]
  reversed: [breaking free, release, awareness, reclaiming power, detachment]

short:
  upright: Something has a hold on you. Name the habit or attachment, and remember the chains are loose.
  reversed: You're breaking free from something that held you back. Keep going.

meaning:
  upright: >-
    A horned figure crouches on a dark pedestal, and two people stand chained below. But
    look closer: the chains around their necks are loose enough to lift off. The Devil is
    about the things that hold us without our full consent: habits, addictions, toxic
    relationships, money worries, or beliefs that keep us small. It isn't about evil. It
    shows where you've given your power away, often without noticing. Naming what has a
    hold on you is the first step. Ask honestly what you're getting from it, and what it's
    costing you.
  reversed: >-
    Reversed, the Devil often shows the moment the chains start to come off. You may be
    recognizing an unhealthy pattern for what it is, setting a boundary, or walking away
    from something that drained you. It can be uncomfortable, since what binds us is
    often familiar. Sometimes the reversal is a warning instead: a pattern you thought
    you'd escaped is pulling you back in. Either way, the card reminds you that you have
    more freedom than you think. Keep choosing it, one step at a time.

in_context:
  love: Intense attraction, or a pattern that isn't healthy. Look honestly at what's binding you.
  work: Feeling trapped by money, a job or pressure. Look for the way out you've been overlooking.
  advice: Name what's holding you, then loosen its grip.

symbolism:
  - "Loose chains around their necks: the trap is real, but escape is possible."
  - "Horned figure on a pedestal: the power we hand to our fears and desires."
  - "Small horns and tails on the couple: becoming like what controls you."
  - "Inverted pentagram: material concerns placed above spirit."
  - "Torch pointed downward: energy turned toward its lowest use."

reflection:
  - What habit or pattern has more control over me than I'd like?
  - What do I get from it, and what does it cost me?
  - What would one small step toward freedom look like?

yes_no: "No"

correspondences:
  element: Earth
  astrology: Capricorn
  hebrew_letter: Ayin

waite_1910:
  upright: >-
    Ravage, violence, vehemence, extraordinary efforts, force, fatality; that which is
    predestined but is not for this reason evil.
  reversed: Evil fatality, weakness, pettiness, blindness.

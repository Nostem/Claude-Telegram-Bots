id: major-13-death
name: Death
arcana: major
number: 13
image: major-13-death.jpg

keywords:
  upright: [endings, transformation, transition, release, renewal]
  reversed: [resisting change, holding on, stagnation, fear of endings, slow transition]

short:
  upright: An ending that makes room for something new. Let go of what's finished so you can move on.
  reversed: You're holding on to something that's already over. Release it, and let the change happen.

meaning:
  upright: >-
    Despite its name, the Death card is almost never about physical death. It's about
    endings and transformation. A skeleton in armor rides a white horse, and everyone, from
    king to child, meets it in the end. On the horizon, the sun rises between two towers.
    This card marks the close of a chapter: a relationship, a job, a habit, an old version
    of you. Endings can be painful, but they also clear space. Something new can only
    begin once the old has truly ended. Let it go with respect, and look toward the rising
    sun.
  reversed: >-
    Reversed, Death suggests an ending you're resisting. You might be holding on to a
    situation, a relationship or an identity that has already run its course, because
    letting go feels frightening. The change may be happening slowly, dragged out by fear.
    It's understandable: endings bring grief, even when they're right. The card gently
    asks what you're keeping alive out of habit or fear. Releasing it doesn't erase what
    it meant to you. It simply makes room for what comes next, and that may be something
    good.

in_context:
  love: A relationship transforms or a chapter closes. Make room for a deeper or different kind of love.
  work: A job, role or project ends, opening the way to something new. Embrace the transition.
  advice: Let what's finished be finished.

symbolism:
  - "Skeleton in armor: change that comes to everyone and can't be stopped."
  - "White horse: purity, and transformation as a natural process."
  - "Black banner with a white rose: beauty and new life within endings."
  - "King, bishop, maiden and child: no one escapes change, whatever their status."
  - "Sun rising between two towers: renewal and the dawn after an ending."

reflection:
  - What in my life has already ended, even if I haven't accepted it yet?
  - What am I afraid to let go of, and why?
  - What could grow in the space an ending leaves?

yes_no: "No"

correspondences:
  element: Water
  astrology: Scorpio
  hebrew_letter: Nun

waite_1910:
  upright: >-
    End, mortality, destruction, corruption; also, for a man, the loss of a benefactor;
    for a woman, many contrarieties; for a maid, failure of marriage projects.
  reversed: Inertia, sleep, lethargy, petrifaction, somnambulism; hope destroyed.

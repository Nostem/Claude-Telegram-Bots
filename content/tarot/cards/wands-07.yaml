id: wands-07
name: Seven of Wands
arcana: minor
suit: wands
number: 7
image: wands-07.jpg

keywords:
  upright: [standing your ground, defending beliefs, perseverance, challenge, protecting your position]
  reversed: [overwhelmed, giving up, exhaustion from defending, yielding, defensiveness]

short:
  upright: Stand your ground. You have the higher position, so defend what matters to you.
  reversed: You're worn out from fighting. Decide which battles are worth keeping up.

meaning:
  upright: >-
    A man stands on high ground holding a wand, fending off six wands rising toward him
    from below. He's outnumbered, but he holds the better position. Notice his mismatched
    shoes: he didn't have time to get ready. The Seven of Wands is about standing up for
    yourself, your beliefs or something you've worked hard for. Challenges and criticism
    may come from several directions. The card says you can hold your ground. Stay
    confident, stay focused, and don't let pressure push you off the hill.
  reversed: >-
    Reversed, the Seven of Wands suggests the pressure is getting to you. You might feel
    overwhelmed, tired of defending yourself, or ready to give up. It can also show
    becoming overly defensive, treating every comment as an attack. The card asks you to
    pick your battles. Some positions are worth defending; others aren't worth the energy.
    Rest if you need to, ask for support, and focus your strength on what truly matters
    to you. A position you no longer believe in isn't worth guarding.

in_context:
  love: Defending your relationship or your boundaries. Stand firm on what matters.
  work: Competition or criticism. Defend your position with confidence.
  advice: Stand your ground on what matters.

symbolism:
  - "Man on high ground: the advantage of a strong position."
  - "Six wands rising from below: challenges, competitors or criticism."
  - "Mismatched shoes: being caught off guard but rising to it anyway."
  - "Determined stance: courage and perseverance."

reflection:
  - What is worth defending in my life right now?
  - Am I standing firm, or just being defensive?
  - Which battles can I let go of?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: Mars in Leo

waite_1910:
  upright: >-
    It is a card of valour, for, on the surface, six are attacking one, who has, however,
    the vantage position. On the intellectual plane, it signifies discussion, wordy
    strife; in business—negotiations, war of trade, barter, competition. It is further a
    card of success, for the combatant is on the top and his enemies may be unable to
    reach him.
  reversed: >-
    Perplexity, embarrassments, anxiety. It is also a caution against indecision.

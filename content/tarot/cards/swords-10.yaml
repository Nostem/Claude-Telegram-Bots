id: swords-10
name: Ten of Swords
arcana: minor
suit: swords
number: 10
image: swords-10.jpg

keywords:
  upright: [rock bottom, painful ending, exhaustion, betrayal, it's over]
  reversed: [recovery, survival, rising again, resisting an ending, lessons learned]

short:
  upright: A painful chapter has ended. It's hard, but this is the bottom; things can only rise.
  reversed: You've survived the worst and are slowly getting back up. Healing has begun.

meaning:
  upright: >-
    A figure lies face down by the water with ten swords in their back, under a black
    sky. But on the horizon, a golden dawn is breaking. The Ten of Swords is about a
    painful ending, a sense of hitting rock bottom, or feeling completely worn out. It can
    point to betrayal, a loss, or a situation that has finally run its course. This card
    is dramatic on purpose: it says this chapter is truly over. And once you've reached the
    bottom, the only way is up. Rest, accept the ending, and look toward the light.
  reversed: >-
    Reversed, the Ten of Swords shows the slow process of getting back up. The worst has
    passed and you're recovering, even if you still feel bruised. It can mean learning
    from a painful experience and refusing to let it define you. Sometimes it shows
    resistance: refusing to accept that something is over, which drags out the pain. The
    card encourages you to let the ending be complete, so the healing can begin. You're
    stronger than this moment, and the dawn is real.

in_context:
  love: A painful breakup or betrayal. It hurts, but it also frees you to heal.
  work: A job or project ending badly, or burnout. Time to rest and start again.
  advice: Let it end, then let yourself rise.

symbolism:
  - "Ten swords: a painful situation that has reached its end."
  - "Figure lying face down: exhaustion and defeat."
  - "Black sky: the darkest point."
  - "Golden dawn on the horizon: hope and a new day coming."
  - "Calm water: peace that follows after the storm."

reflection:
  - What chapter in my life has come to an end?
  - What can I learn from this painful experience?
  - What would help me get back up, one step at a time?

yes_no: "No"

correspondences:
  element: Air
  astrology: Sun in Gemini

waite_1910:
  upright: >-
    Whatsoever is intimated by the design; also pain, affliction, tears, sadness,
    desolation. It is not especially a card of violent death.
  reversed: >-
    Advantage, profit, success, favour, but none of these are permanent; also power and
    authority.

id: major-19-the-sun
name: The Sun
arcana: major
number: 19
image: major-19-the-sun.jpg

keywords:
  upright: [joy, success, vitality, positivity, clarity]
  reversed: [dimmed joy, temporary setback, overconfidence, burnout, inner child neglected]

short:
  upright: Joy, warmth and success. Things are bright, so enjoy it and let yourself shine.
  reversed: The sun is still there, just behind a cloud. Reconnect with simple joys.

meaning:
  upright: >-
    A bright sun beams down on a child riding a white horse, arms spread wide, with
    sunflowers growing over the wall behind. The Sun is one of the most joyful cards in
    the deck. It brings warmth, success, energy and a feeling that things are going well.
    It can mean clarity after confusion, good health and happiness, or simply a season to
    enjoy life. The child reminds you of the playful, open part of yourself. Let yourself
    be seen, celebrate what's going right, and share your warmth with others.
  reversed: >-
    Reversed, the Sun's light is dimmed but not gone. You may feel a bit flat, stressed or
    disconnected from what usually makes you happy. Success might be delayed, or you may
    be too busy or burnt out to enjoy what you have. Occasionally it warns against
    overconfidence, assuming things will work out without effort. The card invites you
    to reconnect with simple pleasures: sunlight, play, laughter, something that makes
    you feel like a kid again. Joy often comes back when you stop chasing it.

in_context:
  love: Happiness, warmth and openness in love. A joyful, honest connection.
  work: Success, recognition and positive energy. Your work shines.
  advice: Celebrate what's going well and let yourself shine.

symbolism:
  - "Radiant sun with a face: life, energy and clarity."
  - "Child on a white horse: innocence, joy and freedom."
  - "Sunflowers: growth that turns toward the light."
  - "Red banner: vitality and celebration."
  - "Wall behind the child: the safety that lets you play freely."

reflection:
  - What is going well in my life right now?
  - When did I last feel playful and free?
  - How can I share my warmth with someone today?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: The Sun
  hebrew_letter: Resh

waite_1910:
  upright: Material happiness, fortunate marriage, contentment.
  reversed: The same in a lesser sense.

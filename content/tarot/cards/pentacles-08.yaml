id: pentacles-08
name: Eight of Pentacles
arcana: minor
suit: pentacles
number: 8
image: pentacles-08.jpg

keywords:
  upright: [craftsmanship, dedication, mastery, practice, attention to detail]
  reversed: [perfectionism, lack of focus, repetitive work, cutting corners, uninspired]

short:
  upright: Steady practice builds mastery. Focus on your craft, one careful piece at a time.
  reversed: The work feels repetitive, rushed or never good enough. Reconnect with why you started.

meaning:
  upright: >-
    A craftsman sits at his bench, carefully carving a pentacle, while finished ones hang
    on a post beside him. A town sits in the distance, far from his concentration. The
    Eight of Pentacles is about dedication and skill. It's the card of practice, study
    and steady improvement: doing the work, again and again, until you're good at it. It
    can point to training, an apprenticeship, or a period of focused effort. The card
    encourages you to take pride in the process. Mastery is built one careful piece at a
    time.
  reversed: >-
    Reversed, the Eight of Pentacles can show that the work has lost its meaning. It may
    feel repetitive and boring, or you may be rushing and cutting corners. It can also
    point to perfectionism, where nothing ever feels good enough to finish. The card asks
    you to reconnect with why you started. What did you love about this skill? Maybe you
    need a new challenge, a rest, or permission to be good enough rather than perfect.
    Quality comes from care, and care is easier when the work still matters to you.

in_context:
  love: Putting real effort into a relationship. Small, consistent care builds trust.
  work: Skill-building, training or focused work. Your effort is paying off.
  advice: Keep practicing; mastery takes time.

symbolism:
  - "Craftsman carving a pentacle: focus and skilled work."
  - "Finished pentacles on display: progress made through repetition."
  - "Town in the distance: setting distractions aside to focus."
  - "Workbench: dedication to a craft."

reflection:
  - What skill am I building right now?
  - Do I take pride in the process, or only the result?
  - Where am I cutting corners or chasing perfection?

yes_no: "Yes"

correspondences:
  element: Earth
  astrology: Sun in Virgo

waite_1910:
  upright: >-
    Work, employment, commission, craftsmanship, skill in craft and business, perhaps in
    the preparatory stage.
  reversed: >-
    Voided ambition, vanity, cupidity, exaction, usury. It may also signify the
    possession of skill, in the sense of the ingenious mind turned to cunning and
    intrigue.

id: major-16-the-tower
name: The Tower
arcana: major
number: 16
image: major-16-the-tower.jpg

keywords:
  upright: [sudden change, upheaval, revelation, breakdown, awakening]
  reversed: [avoiding change, delayed upheaval, inner shift, fear of collapse, rebuilding]

short:
  upright: Sudden change shakes what was built on shaky ground. It's hard, and it clears the way for truth.
  reversed: Change you've been avoiding is building up. Face it now, gently, before it forces itself on you.

meaning:
  upright: >-
    Lightning strikes a tall tower, knocking off its crown, and two figures fall through
    the dark sky. The Tower is one of the most dramatic cards in the deck. It represents
    sudden change: a revelation, a shake-up, or the collapse of something built on false
    foundations. It's rarely comfortable. But the Tower only destroys what wasn't stable
    to begin with, whether that's a belief, a plan or a situation that was never as solid
    as it looked. Once the dust settles, you have a clearer view and room to rebuild on
    truer ground.
  reversed: >-
    Reversed, the Tower can show a change you're trying to hold back, or a crisis that's
    been postponed rather than resolved. You might sense that something needs to fall
    apart, but keep propping it up out of fear. It can also show a quieter, inner
    upheaval: beliefs shifting without any outside drama. Sometimes it means the worst
    has passed and rebuilding has begun. The card asks you to stop bracing against the
    inevitable. Choosing change willingly is usually gentler than having it forced on you.

in_context:
  love: A sudden shake-up or revelation. Hard truths can clear the way for something real.
  work: Unexpected change, restructuring or a plan falling through. Adapt, and rebuild more solidly.
  advice: Let what's unstable fall, and build on truth.

symbolism:
  - "Lightning bolt: sudden insight or change from outside."
  - "Crown knocked off: false ideas and ego brought down."
  - "Falling figures: being forced out of old certainties."
  - "Tower on a rocky peak: structures built on unstable ground."
  - "Falling flames: divine sparks, and truth arriving amid chaos."

reflection:
  - What in my life is built on a shaky foundation?
  - What truth have I been avoiding?
  - What could I rebuild more honestly after this change?

yes_no: "No"

correspondences:
  element: Fire
  astrology: Mars
  hebrew_letter: Peh

waite_1910:
  upright: >-
    Misery, distress, indigence, adversity, calamity, disgrace, deception, ruin. It is a
    card in particular of unforeseen catastrophe.
  reversed: >-
    According to one account, the same in a lesser degree; also oppression, imprisonment,
    tyranny.

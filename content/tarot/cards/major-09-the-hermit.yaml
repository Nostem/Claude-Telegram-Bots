id: major-09-the-hermit
name: The Hermit
arcana: major
number: 9
image: major-09-the-hermit.jpg

keywords:
  upright: [solitude, reflection, inner guidance, wisdom, searching]
  reversed: [isolation, loneliness, withdrawal, avoidance, losing your way]

short:
  upright: Step back and look within. Time alone will light the way forward.
  reversed: Solitude has turned into isolation. Reach out, or find your way back to yourself.

meaning:
  upright: >-
    An old figure in a grey cloak stands alone on a snowy peak, holding up a lantern with
    a star inside. The Hermit is about turning inward: taking time away from noise and
    opinions to figure out what you really think and want. This is a card of reflection,
    study and spiritual searching. It may appear when you need a break from social life,
    or when answers will only come through quiet thought. The lantern lights just a few
    steps ahead, and that's enough. You don't need to see the whole path to keep walking
    it wisely.
  reversed: >-
    Reversed, the Hermit can show solitude that has tipped into isolation or loneliness.
    You may be pulling away from people in a way that no longer helps you, or hiding from
    something you need to face. It can also show the opposite: being so busy and
    surrounded by others that you never get time alone with your thoughts. Ask what you
    need right now. If you've been withdrawn, reach out to one person. If you've been
    constantly busy, carve out some quiet time and check in with yourself.

in_context:
  love: Time apart, or space to understand what you need. A slow, thoughtful approach to love.
  work: Deep focus, study or independent work. Step back to see the bigger picture.
  advice: Take some time alone to think.

symbolism:
  - "Lantern with a six-pointed star: inner wisdom lighting the next step."
  - "Snowy mountain peak: wisdom reached through effort and solitude."
  - "Grey cloak: humility and withdrawal from the world."
  - "Staff: patience, support and steady progress."
  - "Head bowed: looking inward and paying attention."

reflection:
  - What question needs quiet time before I can answer it?
  - Am I resting in solitude, or hiding in it?
  - What do I know when I tune out other people's opinions?

yes_no: "Maybe"

correspondences:
  element: Earth
  astrology: Virgo
  hebrew_letter: Yod

waite_1910:
  upright: >-
    Prudence, circumspection; also and especially treason, dissimulation, roguery,
    corruption.
  reversed: Concealment, disguise, policy, fear, unreasoned caution.

id: cups-king
name: King of Cups
arcana: minor
suit: cups
court: king
image: cups-king.jpg

keywords:
  upright: [emotional balance, calm leadership, diplomacy, wisdom, generosity]
  reversed: [emotional manipulation, volatility, coldness, bottled-up feelings, moodiness]

short:
  upright: Calm in the storm. Lead with compassion while keeping your emotions steady.
  reversed: Emotions are either bottled up or spilling over. Find your center before you act.

meaning:
  upright: >-
    A king sits on a stone throne floating in a rough sea, holding a cup and a scepter.
    A ship sails on one side and a fish leaps on the other, yet he stays calm. The King
    of Cups represents emotional maturity: the ability to feel deeply without being
    swept away. He listens, stays steady under pressure, and leads with compassion. This
    card may point to a wise, caring person in your life, or ask you to become that calm
    center yourself. Respond rather than react, and use your empathy to guide others.
  reversed: >-
    Reversed, the King's calm can crack. You may be bottling up feelings until they leak
    out as coldness or sudden outbursts. It can also point to someone using emotions to
    manipulate, guilt-trip or control. Sometimes it shows emotional burnout: always being
    the steady one, with no one to steady you. The card asks you to find healthy outlets
    for what you feel and to set boundaries with people who play emotional games. True
    balance includes letting yourself be supported too.

in_context:
  love: A mature, caring partner, or a relationship that feels emotionally secure.
  work: Diplomatic leadership. Stay calm and treat people with kindness.
  advice: Stay calm, and lead with your heart.

symbolism:
  - "Throne floating on rough sea: steadiness amid emotional turmoil."
  - "Cup and scepter: emotional wisdom joined with authority."
  - "Fish amulet: creativity and a connection to the depths."
  - "Ship and leaping fish: the world of feeling moving around him."

reflection:
  - How do I stay calm when emotions run high?
  - Am I bottling something up?
  - Who supports me when I'm the steady one?

yes_no: "Yes"

correspondences:
  element: Air of Water
  astrology: Late Libra to mid Scorpio

waite_1910:
  upright: >-
    Fair man, man of business, law, or divinity; responsible, disposed to oblige the
    Querent; also equity, art and science, including those who profess science, law and
    art; creative intelligence.
  reversed: >-
    Dishonest, double-dealing man; roguery, exaction, injustice, vice, scandal, pillage,
    considerable loss.

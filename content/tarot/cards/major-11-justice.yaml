id: major-11-justice
name: Justice
arcana: major
number: 11
image: major-11-justice.jpg

keywords:
  upright: [fairness, truth, accountability, cause and effect, clarity]
  reversed: [unfairness, dishonesty, avoiding responsibility, bias, imbalance]

short:
  upright: Truth and fairness. Your choices have consequences, so weigh things honestly and act with integrity.
  reversed: Something is unfair or unbalanced. Take honest responsibility for your part.

meaning:
  upright: >-
    Justice sits between two pillars, holding an upright sword in one hand and balanced
    scales in the other. This card is about truth, fairness and cause and effect: what you
    put out, you eventually get back. It may appear when you're facing a decision that
    needs clear, honest thinking, or when the results of past choices are coming in. It
    can also point to contracts, agreements or legal matters. The card asks you to look
    at the facts without bias, take responsibility for your part, and choose what you can
    stand behind.
  reversed: >-
    Reversed, Justice points to something out of balance. You might be treated unfairly,
    or you might be avoiding responsibility for your own role in a situation. It can show
    dishonesty, bias, or a decision made on emotion instead of facts. This isn't a call
    to blame yourself or others, but to get honest. What really happened? What part was
    yours? Where can you make things right? If you've been wronged, it's fair to ask for
    accountability. Owning your part, even quietly, is often what restores the balance.

in_context:
  love: Honesty and fairness in a relationship. Balance give and take, and talk openly.
  work: Fair decisions, contracts and accountability. Integrity will be noticed.
  advice: Be honest, even when it's uncomfortable.

symbolism:
  - "Upright sword: clear thinking and decisive truth."
  - "Balanced scales: fairness and weighing each side."
  - "Two pillars: law, structure and balance."
  - "Steady, direct gaze: impartiality and seeing things as they are."
  - "Purple veil behind the figure: wisdom, and truth that can't be hidden."

reflection:
  - What would a fair decision look like here?
  - Is there something I need to take responsibility for?
  - Where am I letting feelings override the facts?

yes_no: "Maybe"

correspondences:
  element: Air
  astrology: Libra
  hebrew_letter: Lamed

waite_1910:
  upright: Equity, rightness, probity, executive; triumph of the deserving side in law.
  reversed: >-
    Law in all its departments, legal complications, bigotry, bias, excessive severity.

id: major-14-temperance
name: Temperance
arcana: major
number: 14
image: major-14-temperance.jpg

keywords:
  upright: [balance, moderation, patience, healing, harmony]
  reversed: [excess, imbalance, impatience, overdoing, discord]

short:
  upright: Balance and patience. Blend the right ingredients slowly and let healing happen.
  reversed: Something is out of balance, too much or too little. Find your middle ground again.

meaning:
  upright: >-
    A winged angel stands with one foot on land and one in the water, carefully pouring
    liquid between two cups. Temperance is about balance, patience and the art of blending
    opposites into something new. It's a card of healing and moderation: not too much,
    not too little. It often appears when a situation needs a calm, steady hand rather
    than a dramatic move. Small adjustments made patiently will bring harmony. The path
    behind the angel leads toward distant mountains, a reminder that real progress is
    gradual.
  reversed: >-
    Reversed, Temperance points to imbalance. You may be overdoing something, such as
    work, spending, partying or worrying, or neglecting something you need. Impatience
    could be pushing you to rush a process that needs time. Relationships might feel out
    of sync. The card asks you to notice where the scales have tipped and gently bring
    them back. Not through a big dramatic fix, but through small, steady changes: an
    earlier night, a quieter week, one honest talk. Balance is something you practice,
    not something you achieve once.

in_context:
  love: Harmony, compromise and healing between partners. Go slowly and meet in the middle.
  work: Steady progress, teamwork and balanced effort. Avoid extremes.
  advice: Find the middle way, and be patient.

symbolism:
  - "Water poured between two cups: blending opposites and the flow of healing."
  - "One foot on land and one in water: balancing the practical and the emotional."
  - "Angel's wings: guidance and spiritual calm."
  - "Triangle within a square on the robe: spirit grounded in the material world."
  - "Path leading to the mountains: a long, gradual journey toward a goal."

reflection:
  - Where in my life have I gone to an extreme?
  - What two parts of my life need to be blended better?
  - What would patience look like here?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: Sagittarius
  hebrew_letter: Samekh

waite_1910:
  upright: Economy, moderation, frugality, management, accommodation.
  reversed: >-
    Things connected with churches, religions, sects, the priesthood, sometimes even the
    priest who will marry the Querent; also disunion, unfortunate combinations, competing
    interests.

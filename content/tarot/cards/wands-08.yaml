id: wands-08
name: Eight of Wands
arcana: minor
suit: wands
number: 8
image: wands-08.jpg

keywords:
  upright: [speed, momentum, swift action, messages, things moving fast]
  reversed: [slowdown, frustration, rushing, miscommunication, waiting]

short:
  upright: Things are moving fast. News, progress and momentum are coming your way.
  reversed: Plans are stalled or rushed. Slow down, or wait for the right timing.

meaning:
  upright: >-
    Eight wands fly through the clear sky in parallel, about to land over a peaceful
    landscape with a river below. There are no people in this card, only motion. The
    Eight of Wands is about speed and momentum: news arriving, plans moving quickly,
    obstacles clearing out of the way. It can point to travel, fast replies or a burst of
    progress after a slow period. The card encourages you to ride the wave. Act quickly,
    keep your focus, and let things fall into place.
  reversed: >-
    Reversed, the Eight of Wands suggests the momentum has stalled. Messages may be
    delayed, plans held up, or travel disrupted. It can also show the opposite problem:
    rushing so fast that mistakes and miscommunications pile up. The card asks you to
    check your timing. If things are slow, use the pause to prepare. If you're racing,
    slow down enough to aim well. Either way, patience now will help the energy flow again
    when the moment is right. Good things can still arrive on time.

in_context:
  love: Things moving quickly, sudden messages or a whirlwind romance. Enjoy the rush.
  work: Fast progress, quick decisions or travel. Keep up the pace.
  advice: Move with the momentum.

symbolism:
  - "Eight wands flying in parallel: swift movement in one direction."
  - "Clear sky: nothing blocking the way."
  - "Wands about to land: things arriving soon."
  - "River below: the flow of events."
  - "No people: pure energy and motion."

reflection:
  - What is moving quickly in my life right now?
  - Am I ready to act when the opportunity arrives?
  - Is anything getting lost because I'm rushing?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: Mercury in Sagittarius

waite_1910:
  upright: >-
    Activity in undertakings, the path of such activity, swiftness, as that of an express
    messenger; great haste, great hope, speed towards an end which promises assured
    felicity; generally, that which is on the move; also the arrows of love.
  reversed: >-
    Arrows of jealousy, internal dispute, stingings of conscience, quarrels; and domestic
    disputes for persons who are married.

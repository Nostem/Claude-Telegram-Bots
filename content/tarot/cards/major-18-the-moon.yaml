id: major-18-the-moon
name: The Moon
arcana: major
number: 18
image: major-18-the-moon.jpg

keywords:
  upright: [uncertainty, illusion, intuition, dreams, fear]
  reversed: [clarity returning, released fear, truth revealed, confusion, inner turmoil]

short:
  upright: Things aren't fully clear yet. Move carefully, trust your intuition, and question your fears.
  reversed: The fog is lifting and the truth is coming out. Let go of fears that no longer fit.

meaning:
  upright: >-
    A full moon shines over a path that winds between two towers. A dog and a wolf howl
    at the sky, and a crayfish crawls up from a pool. The Moon is a card of uncertainty:
    things aren't what they seem, and you can't see the whole picture yet. Fears and
    imagination can feel louder than facts. It's also the card of dreams and intuition,
    which can guide you where logic can't. Move forward slowly. Pay attention to your
    dreams and gut feelings, but double-check your fears before you act on them. Clarity
    will come.
  reversed: >-
    Reversed, the Moon often shows the fog beginning to clear. A confusing situation may
    be making more sense, a hidden truth may come to light, or a fear may be losing its
    grip on you. Sometimes, though, it shows confusion turning inward: anxiety, mixed
    signals, or being unable to tell what's real. If that feels familiar, ground yourself
    in the facts you do know and talk things through with someone you trust. The light
    you're waiting for is closer than it seems.

in_context:
  love: Uncertainty or mixed signals. Don't assume the worst, and don't ignore red flags either.
  work: Unclear information or hidden factors. Get the facts before making big moves.
  advice: Trust your intuition, but check your fears against the facts.

symbolism:
  - "Moon with a face: reflected light, intuition and illusion."
  - "Dog and wolf: the tame and wild sides of our nature."
  - "Crayfish rising from the pool: fears and feelings emerging from the subconscious."
  - "Winding path between two towers: a journey through the unknown."
  - "Falling drops of light: subtle guidance in the dark."

reflection:
  - Which of my fears are facts, and which are stories?
  - What is my intuition telling me that logic can't explain?
  - What would help me see this situation more clearly?

yes_no: "Maybe"

correspondences:
  element: Water
  astrology: Pisces
  hebrew_letter: Qoph

waite_1910:
  upright: >-
    Hidden enemies, danger, calumny, darkness, terror, deception, occult forces, error.
  reversed: Instability, inconstancy, silence, lesser degrees of deception and error.

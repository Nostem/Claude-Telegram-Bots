id: swords-09
name: Nine of Swords
arcana: minor
suit: swords
number: 9
image: swords-09.jpg

keywords:
  upright: [anxiety, worry, sleepless nights, guilt, overthinking]
  reversed: [hope returning, reaching out, easing fear, recovery from anxiety, facing fears]

short:
  upright: Worry is keeping you up at night. The fear is real, but it may be bigger than the problem.
  reversed: The worst of the anxiety is lifting. Talk about it, and let the light back in.

meaning:
  upright: >-
    A figure sits up in bed in the dark, face buried in their hands, while nine swords
    hang on the black wall behind them. The Nine of Swords is the card of anxiety, worry
    and sleepless nights. It often shows a mind caught in a loop of fear, guilt or
    "what ifs." Notice that the swords hang on the wall rather than piercing the person:
    much of the pain is coming from thoughts. That doesn't make it any less real. The card
    gently suggests sharing your worries with someone you trust. Things often look smaller
    in daylight.
  reversed: >-
    Reversed, the Nine of Swords can show the night beginning to end. You may be finding
    ways to manage anxiety, opening up to someone, or realizing a fear was bigger in your
    head than in reality. Sometimes, though, it shows worry so bottled up that it feels
    impossible to share. If that's where you are, please reach out to a friend, a support
    line or a professional. You don't have to carry this alone, and asking for help is a
    sign of strength, not weakness.

in_context:
  love: Worry or insecurity in a relationship. Talk openly instead of spiraling alone.
  work: Stress, overthinking or fear of failure. Break problems into smaller steps.
  advice: Share your worries; they shrink in the light.

symbolism:
  - "Figure sitting up in bed: waking from a nightmare, unable to rest."
  - "Hands over the face: despair, shame or exhaustion."
  - "Nine swords on the wall: thoughts and fears hanging over the mind."
  - "Quilt of roses and astrological signs: comfort and hope still within reach."
  - "Black background: the darkness of night, which always ends."

reflection:
  - What worry keeps coming back to me?
  - How much of this fear is fact, and how much is imagination?
  - Who could I talk to about what's weighing on me?

yes_no: "No"

correspondences:
  element: Air
  astrology: Mars in Gemini

waite_1910:
  upright: Death, failure, miscarriage, delay, deception, disappointment, despair.
  reversed: Imprisonment, suspicion, doubt, reasonable fear, shame.

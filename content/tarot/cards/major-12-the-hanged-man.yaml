id: major-12-the-hanged-man
name: The Hanged Man
arcana: major
number: 12
image: major-12-the-hanged-man.jpg

keywords:
  upright: [surrender, pause, new perspective, letting go, waiting]
  reversed: [stalling, resistance, indecision, pointless sacrifice, stuck]

short:
  upright: Pause and see things from a new angle. Letting go may bring the insight you need.
  reversed: You're stuck in limbo or resisting a needed pause. Decide what to release.

meaning:
  upright: >-
    A man hangs upside down by one foot from a living tree, yet his face is calm and a
    halo glows around his head. The Hanged Man is about the wisdom of pausing. Sometimes
    the way forward is to stop pushing, let go of control, and see the situation from a
    completely different angle. This card can point to a waiting period, a sacrifice made
    for something more important, or a shift in perspective that changes everything. It
    may feel uncomfortable, but this suspension has a purpose. Insight often arrives once
    you stop struggling.
  reversed: >-
    Reversed, the Hanged Man suggests a pause that has gone on too long, or one you keep
    resisting. You may be stalling on a decision, waiting for a perfect moment that won't
    come, or making sacrifices that no longer serve anyone. It can also show restlessness:
    trying to force progress when things genuinely need time. Ask yourself whether you
    need to let go of something, or simply make a choice and move. Either way, staying
    in limbo is a choice too.

in_context:
  love: A pause or a shift in how you see the relationship. Let go of expectations to see clearly.
  work: Projects on hold, or a fresh angle on a problem. Don't force it; reframe it.
  advice: Stop pushing and look at it from another angle.

symbolism:
  - "Hanging upside down: seeing the world from a completely new perspective."
  - "Calm face and glowing halo: peace and insight in surrender."
  - "Living tree: growth, even during a pause."
  - "Crossed leg and hands behind his back: willing stillness and patience."
  - "Red and blue clothing: passion and calm wisdom held together."

reflection:
  - What would I see if I looked at this from the opposite side?
  - What am I holding onto that I could release?
  - Is this pause a gift, or am I stalling?

yes_no: "Maybe"

correspondences:
  element: Water
  astrology: Neptune (modern); Water (traditional)
  hebrew_letter: Mem

waite_1910:
  upright: >-
    Wisdom, circumspection, discernment, trials, sacrifice, intuition, divination,
    prophecy.
  reversed: Selfishness, the crowd, body politic.

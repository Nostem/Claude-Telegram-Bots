id: major-08-strength
name: Strength
arcana: major
number: 8
image: major-08-strength.jpg

keywords:
  upright: [inner strength, courage, compassion, patience, gentle power]
  reversed: [self-doubt, fear, insecurity, low energy, harshness]

short:
  upright: True strength is gentle. Meet challenges with patience, courage and compassion.
  reversed: Self-doubt or fear is getting the upper hand. Be kind to yourself and rebuild your confidence.

meaning:
  upright: >-
    A woman calmly closes the mouth of a lion, not with force, but with a gentle touch.
    Strength is about a quiet kind of power: courage, patience, and the ability to stay
    calm when emotions run high. The lion can stand for anger, fear, desire or any wild
    feeling. This card doesn't ask you to fight it, but to befriend it and guide it.
    It often appears when you're stronger than you realize, or when a situation calls
    for softness rather than force. Compassion, for yourself and others, is the real
    source of your strength here.
  reversed: >-
    Reversed, Strength suggests your inner lion feels out of control, or that you've lost
    touch with your own courage. You may be doubting yourself, feeling drained, or letting
    fear make decisions. Sometimes it shows frustration coming out sideways, as harshness
    toward others or yourself. The way back isn't to try harder or be tougher. It's to
    slow down, take care of your energy, and speak to yourself the way you'd speak to
    someone you love. Your strength hasn't gone anywhere; it just needs gentleness to
    return.

in_context:
  love: Patience and kindness strengthen the bond. Handle tension with softness, not force.
  work: Quiet confidence and persistence win out. Lead calmly under pressure.
  advice: Be gentle and brave at the same time.

symbolism:
  - "Woman calming the lion: mastering strong feelings through gentleness."
  - "Infinity sign above her head: endless patience and spiritual strength."
  - "White robe: a pure heart and good intentions."
  - "Garland of flowers: beauty and nature as sources of strength."
  - "Bright yellow sky: optimism and warmth."

reflection:
  - What strong feeling in me needs gentleness instead of a fight?
  - Where have I been braver than I give myself credit for?
  - How can I be kinder to myself today?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: Leo
  hebrew_letter: Teth

waite_1910:
  upright: Power, energy, action, courage, magnanimity; also complete success and honours.
  reversed: Despotism, abuse of power, weakness, discord, sometimes even disgrace.

id: major-20-judgement
name: Judgement
arcana: major
number: 20
image: major-20-judgement.jpg

keywords:
  upright: [awakening, reflection, renewal, calling, forgiveness]
  reversed: [self-judgment, doubt, ignoring the call, regret, stagnation]

short:
  upright: A wake-up call. Reflect on the past, forgive what you can, and answer what's calling you.
  reversed: Harsh self-judgment is holding you back. Learn from the past and let it go.

meaning:
  upright: >-
    An angel blows a trumpet from the clouds, and people rise up below with open arms.
    Judgement is a card of awakening: a moment when you see your life clearly and feel
    called toward something new. It often comes after a long period of growth, asking you
    to reflect on where you've been, accept it, and step into the next version of
    yourself. It can also be about forgiveness, of others or of yourself. This isn't
    about being judged harshly. It's about hearing a call and choosing to rise to meet
    it.
  reversed: >-
    Reversed, Judgement suggests something is getting in the way of that awakening. You
    may be judging yourself too harshly, stuck replaying past mistakes, or doubting that
    you deserve a fresh start. It can also show a calling you keep ignoring because it
    feels too big or too risky. The card asks you to be fair to your past self: you did
    what you could with what you knew. Take the lesson, release the guilt, and listen
    again for what's calling you.

in_context:
  love: Reflection and a fresh start. Old wounds can heal, and a relationship can be reborn.
  work: A calling, a career shift or an important decision. Listen to what truly motivates you.
  advice: Forgive the past and answer the call.

symbolism:
  - "Angel's trumpet: a wake-up call, and a message you can't ignore."
  - "Figures rising with open arms: renewal, and saying yes to a new life."
  - "Flag with a cross: balance and spiritual transformation."
  - "Mountains in the distance: the challenges you've already passed."
  - "Water below: emotional cleansing before a fresh start."

reflection:
  - What is calling me right now?
  - What do I need to forgive, in myself or in others?
  - What have I learned from my past that I can carry forward?

yes_no: "Yes"

correspondences:
  element: Fire
  astrology: Pluto (modern); Fire (traditional)
  hebrew_letter: Shin

waite_1910:
  upright: >-
    Change of position, renewal, outcome. Another account specifies total loss through
    lawsuit.
  reversed: Weakness, pusillanimity, simplicity; also deliberation, decision, sentence.
